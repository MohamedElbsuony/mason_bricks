name: app_scaffold
description: A clean-architecture Flutter project scaffold brick.
version: 0.1.0+1

environment:
  mason: ">=0.1.0-dev.38 <1.0.0"

vars:
  project_name:
    type: string
    description: Enter project name
    default: my_app
