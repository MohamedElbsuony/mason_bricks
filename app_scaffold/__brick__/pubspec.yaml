name: {{project_name.snakeCase()}}
description: "{{project_description}}"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing & Responsive UI
  go_router: ^13.2.0
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.10+1

  # State Management & DI
  bloc: ^8.1.3
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0

  # Functional Programming & Data Utilities
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Networking & Environment
  dio: ^5.4.0
  flutter_dotenv: ^5.1.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/env/
    - assets/images/
